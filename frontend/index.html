<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault | Mi Colección</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuración básica de Tailwind para colores personalizados
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                clifford: '#da373d',
                vdark: '#141414', // Fondo tipo Netflix
                card: '#1f1f1f',  // Fondo de tarjeta
              }
            }
          }
        }
    </script>
    <style>
        .game-card img {
          transition: transform 0.3s ease;
        }
        .game-card:hover img {
          transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-vdark text-gray-200 font-sans antialiased">
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
