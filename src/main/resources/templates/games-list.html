<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>GameVault | Mi Colección</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { vdark: "#141414", card: "#1f1f1f" },
                },
            },
        };
    </script>
    <style>
        .game-card img { transition: transform 0.3s ease; }
        .game-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-vdark text-gray-200 font-sans">
<nav class="bg-black/80 backdrop-blur-sm sticky top-0 z-50 border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🎮</span>
            <h1 class="text-3xl font-bold text-white tracking-tighter">
                Game<span class="text-red-600">Vault</span>
            </h1>
        </div>
        <span class="text-gray-400 text-sm italic">Tu Colección Personal</span>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-10">
    <section class="bg-card p-8 rounded-2xl border border-gray-800 shadow-xl mb-12">
        <h2 id="form-title" class="text-2xl font-semibold text-white mb-6 flex items-center gap-2">
            Añadir Nuevo Título
        </h2>

        <form id="game-form" th:action="@{/admin/games/add}" method="POST" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <input type="hidden" id="game-id" name="id">

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Título del Juego</label>
                <input type="text" id="input-title" name="title" required
                       class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">Categoría</label>
                <input type="text" id="input-category" name="categoryName" required
                       class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-1">URL de la Imagen</label>
                <input type="url" id="input-image" name="imageUrl" required
                       class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none">
            </div>
            <div class="flex gap-2">
                <button type="submit" id="submit-btn"
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition shadow-lg">
                    Añadir
                </button>
                <button type="button" id="cancel-btn" onclick="resetForm()"
                        class="hidden bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-4 rounded-lg transition">
                    ✖
                </button>
            </div>
        </form>
    </section>

    <section>
        <h2 class="text-3xl font-bold text-white mb-8 tracking-tight">Mi Bóveda de Juegos</h2>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <div th:each="game : ${games}" class="game-card group relative bg-card rounded-lg overflow-hidden shadow-md border border-gray-800 transition-all duration-300">

                <div class="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                    <button type="button"
                            th:data-id="${game.idGame}"
                            th:data-title="${game.titleGame}"
                            th:data-category="${game.category?.name}"
                            th:data-image="${game.imageUrlGame}"
                            onclick="handleEditClick(this)"
                            class="bg-black/60 hover:bg-blue-600 p-2 rounded-full backdrop-blur-md transition-colors"
                            title="Editar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16">
                            <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                        </svg>
                    </button>

                    <a th:href="@{/admin/games/delete/{id}(id=${game.idGame})}"
                       onclick="return confirm('¿Seguro que quieres eliminar este juego?')"
                       class="bg-black/60 hover:bg-red-600 p-2 rounded-full backdrop-blur-md transition-colors"
                       title="Eliminar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16">
                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                        </svg>
                    </a>
                </div>

                <div class="aspect-[2/3] overflow-hidden bg-gray-900">
                    <img th:src="${game.imageUrlGame}" class="w-full h-full object-cover" alt="Portada"/>
                </div>

                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent p-4 flex flex-col justify-end opacity-0 group-hover:opacity-100 transition-opacity">
                    <h3 class="text-lg font-bold text-white leading-tight" th:text="${game.titleGame}">Título</h3>
                    <span class="inline-block mt-2 bg-red-600 text-[10px] text-white font-bold px-2 py-0.5 rounded w-max" th:text="${game.category?.name}">Categoría</span>
                </div>

                <div class="p-3 bg-card group-hover:bg-vdark transition-colors">
                    <p class="text-sm font-semibold text-gray-100 truncate" th:text="${game.titleGame}">Título</p>
                </div>
            </div>
        </div>
    </section>
</main>
<script th:src="@{/scripts/main.js}"></script>
</body>
</html>
