<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title>GameVault | Mi Colección</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: { vdark: "#141414", card: "#1f1f1f" },
                    },
                },
            };
        </script>
        <style>
            .game-card img {
                transition: transform 0.3s ease;
            }
            .game-card:hover img {
                transform: scale(1.05);
            }
        </style>
    </head>
    <body class="bg-vdark text-gray-200 font-sans">
        <nav
            class="bg-black/80 backdrop-blur-sm sticky top-0 z-50 border-b border-gray-800"
        >
            <div
                class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"
            >
                <div class="flex items-center gap-2">
                    <span class="text-3xl">🎮</span>
                    <h1 class="text-3xl font-bold text-white tracking-tighter">
                        Game<span class="text-red-600">Vault</span>
                    </h1>
                </div>
                <span class="text-gray-400 text-sm italic"
                    >Tu Colección Personal</span
                >
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 py-10">
            <section
                class="bg-card p-8 rounded-2xl border border-gray-800 shadow-xl mb-12"
            >
                <h2
                    class="text-2xl font-semibold text-white mb-6 flex items-center gap-2"
                >
                    <span class="text-red-500">➕</span> Añadir Nuevo Título
                </h2>

                <form
                    th:action="@{/admin/games/add}"
                    method="POST"
                    class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end"
                >
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-400 mb-1"
                            >Título del Juego</label
                        >
                        <input
                            type="text"
                            name="title"
                            required
                            class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-400 mb-1"
                            >Categoría</label
                        >
                        <input
                            type="text"
                            name="categoryName"
                            required
                            class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none"
                        />
                    </div>
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-400 mb-1"
                            >URL de la Imagen</label
                        >
                        <input
                            type="url"
                            name="imageUrl"
                            required
                            class="w-full bg-vdark border border-gray-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none"
                        />
                    </div>
                    <button
                        type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition duration-150 shadow-lg"
                    >
                        Añadir a la Bóveda
                    </button>
                </form>
            </section>

            <section>
                <h2 class="text-3xl font-bold text-white mb-8 tracking-tight">
                    Mi Bóveda de Juegos
                </h2>

                <div
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6"
                >
                    <div
                        th:each="game : ${games}"
                        class="game-card group relative bg-card rounded-lg overflow-hidden shadow-md border border-gray-800 transition-all duration-300"
                    >
                        <div class="aspect-[2/3] overflow-hidden bg-gray-900">
                            <img
                                th:src="${game.imageUrlGame}"
                                class="w-full h-full object-cover"
                                alt="Portada"
                            />
                        </div>

                        <div
                            class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent p-4 flex flex-col justify-end opacity-0 group-hover:opacity-100 transition-opacity"
                        >
                            <h3
                                class="text-lg font-bold text-white leading-tight"
                                th:text="${game.titleGame}"
                            >
                                Título
                            </h3>
                            <span
                                class="inline-block mt-2 bg-red-600 text-[10px] text-white font-bold px-2 py-0.5 rounded w-max"
                                th:text="${game.category?.name}"
                                >Categoría</span
                            >
                        </div>

                        <div
                            class="p-3 bg-card group-hover:bg-vdark transition-colors"
                        >
                            <p
                                class="text-sm font-semibold text-gray-100 truncate"
                                th:text="${game.titleGame}"
                            >
                                Título
                            </p>
                        </div>
                    </div>
                </div>

                <div
                    th:if="${#lists.isEmpty(games)}"
                    class="text-center py-20 bg-card rounded-xl border border-gray-800"
                >
                    <span class="text-6xl mb-4 block">👻</span>
                    <p class="text-xl text-gray-500">
                        Tu bóveda está vacía. ¡Añade tu primer juego!
                    </p>
                </div>

                <div
                    class="mt-12 flex justify-center gap-4"
                    th:if="${hasNext || currentPage > 0}"
                >
                    <a
                        th:if="${currentPage > 0}"
                        th:href="@{/admin/games(page=${currentPage - 1})}"
                        class="px-6 py-2 bg-gray-800 hover:bg-gray-700 rounded-full text-white transition"
                        >Anterior</a
                    >
                    <a
                        th:if="${hasNext}"
                        th:href="@{/admin/games(page=${currentPage + 1})}"
                        class="px-6 py-2 bg-red-600 hover:bg-red-700 rounded-full text-white transition shadow-lg"
                        >Siguiente</a
                    >
                </div>
            </section>
        </main>
    </body>
</html>
