<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>GameVault Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">GameVault | Admin Panel</span>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mi Colección de Juegos</h2>
        <button class="btn btn-primary">Agregar Nuevo (Wiki)</button>
    </div>

    <div class="row">
        <div th:each="game : ${games}" class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <img th:if="${game.imageUrl}" th:src="${game.imageUrl}" class="card-img-top" alt="Portada" style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${game.title}">Título</h5>
                    <p class="card-text text-muted small" th:text="${game.category.name}">Categoría</p>
                    <span class="badge bg-info" th:text="${game.platform}">Plataforma</span>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 d-flex justify-content-center">
        <a th:if="${hasNext}" th:href="@{/admin/games(page=${param.page != null ? T(java.lang.Integer).parseInt(param.page) + 1 : 1})}"
           class="btn btn-outline-secondary">Cargar más...</a>
    </div>
</div>
</body>
</html>
